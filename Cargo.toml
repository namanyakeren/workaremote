[workspace]
resolver = "2"
members = ["proto", "agent", "server"]

[workspace.package]
version = "1.9.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"

# Versions are pinned exactly: the Windows 7 agent must be built with
# rustc 1.77.1, so every dependency has to compile on that toolchain.
[workspace.dependencies]
serde = { version = "=1.0.200", features = ["derive"] }
serde_json = "=1.0.116"
tokio = { version = "=1.37.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
anyhow = "=1.0.83"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
